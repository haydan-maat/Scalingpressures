<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Scaling Pressure Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@300;400;500;600&family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    /* Ma'at Partners brand palette */
    --obsidian:       #31374f; /* core: backgrounds, headings, typography, logos */
    --quiet-mist:     #ACBAC4; /* dividers, supporting graphic elements */
    --sand:           #E2D9BC; /* graphic elements */
    --stone:          #F2ECDF; /* backgrounds, negative space */
    --red-oxide:      #863A3A; /* accent: CTAs, highlights, quotes, emphasis */

    --surface-1:      #ffffff;
    --page:           var(--stone);
    --text-primary:   var(--obsidian);
    --text-secondary: rgba(49,55,79,0.72);
    --text-muted:     rgba(49,55,79,0.52);
    --grid:            #e7e2d3;
    --baseline:       var(--quiet-mist);
    --border:         rgba(49,55,79,0.14);
    --accent:         var(--red-oxide);
    --accent-dark:    #6e2f2f;

    --font-heading: 'Manrope', system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-body:    'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-accent:  'Fraunces', Georgia, serif;

    /* These 6 stay a separate, independently-validated chart palette rather
       than being forced from the 5-color brand palette — Ma'at's colors are
       two hues plus three close-together neutrals, not built for 6-way
       categorical separation. See dataviz validation note in the JS below. */
    --cat-1: #2a78d6; /* Founder evolution */
    --cat-2: #eb6834; /* People & team dynamics */
    --cat-3: #1baf7a; /* Structure & organisation */
    --cat-4: #eda100; /* Culture & values */
    --cat-5: #e87ba4; /* Performance & progress */
    --cat-6: #008300; /* Reward & development */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--page);
    color: var(--text-primary);
    line-height: 1.5;
  }

  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 80px;
    min-height: 100vh;
  }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
  }

  @media (max-width: 480px) {
    .card { padding: 28px 20px; }
    .app { padding: 28px 14px 60px; }
  }

  .eyebrow {
    font-family: var(--font-heading);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin: 0 0 12px;
  }

  h1 {
    font-family: var(--font-accent);
    font-size: 32px;
    line-height: 1.2;
    margin: 0 0 16px;
    font-weight: 600;
    color: var(--obsidian);
  }

  h2 {
    font-family: var(--font-heading);
    font-size: 22px;
    line-height: 1.3;
    margin: 0 0 14px;
    font-weight: 700;
  }

  p.lead {
    font-size: 16px;
    color: var(--text-secondary);
    margin: 0 0 28px;
  }

  .btn {
    appearance: none;
    border: none;
    border-radius: 10px;
    padding: 14px 26px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-primary {
    font-family: var(--font-accent);
    font-weight: 500;
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled {
    background: var(--stone);
    color: var(--text-muted);
    cursor: not-allowed;
  }

  .btn-secondary {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--page); }

  .btn-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
    gap: 12px;
  }
  .btn-row.center { justify-content: center; }

  /* progress */
  .progress-wrap {
    margin-bottom: 24px;
  }
  .progress-track {
    height: 6px;
    background: var(--grid);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.25s ease;
  }
  .progress-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* option cards */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 4px 0 4px;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    padding: 15px 18px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--surface-1);
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    color: var(--text-primary);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option:hover { border-color: var(--baseline); background: var(--page); }
  .option.selected {
    border-color: var(--obsidian);
    background: rgba(49,55,79,0.06);
  }
  .option .dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1.5px solid var(--baseline);
    flex: none;
    position: relative;
  }
  .option.selected .dot {
    border-color: var(--obsidian);
  }
  .option.selected .dot::after {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: var(--obsidian);
  }

  .cat-tag {
    display: inline-block;
    font-family: var(--font-heading);
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
  }

  .q-text {
    font-family: var(--font-heading);
    font-size: 20px;
    font-weight: 700;
    line-height: 1.35;
    margin: 0 0 22px;
  }

  input[type="email"] {
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: inherit;
    margin-bottom: 8px;
  }
  input[type="email"]:focus { outline: 2px solid var(--accent); border-color: var(--accent); }

  .fine-print {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 10px 0 0;
  }

  /* results */
  .headline-box {
    background: rgba(226,217,188,0.35);
    border: 1px solid rgba(226,217,188,0.9);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 28px;
  }
  .headline-box .eyebrow { color: var(--accent); }
  .headline-box p { margin: 0; font-size: 16px; color: var(--text-primary); }
  .headline-box strong { color: var(--text-primary); }

  .focus-lead {
    font-family: var(--font-heading);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 14px;
  }
  .focus-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 28px;
  }
  .focus-card {
    display: flex;
    gap: 14px;
    padding: 18px 20px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .focus-rank {
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-family: var(--font-heading);
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .focus-body { flex: 1; min-width: 0; }
  .focus-title-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 8px;
  }
  .focus-title { font-family: var(--font-heading); font-size: 15px; font-weight: 700; color: var(--text-primary); }
  .focus-score { font-size: 12.5px; color: var(--text-muted); white-space: nowrap; }
  .focus-quote {
    margin: 0;
    padding: 0 0 0 12px;
    border-left: 2px solid var(--accent);
    font-family: var(--font-accent);
    font-size: 15.5px;
    font-style: italic;
    color: var(--text-primary);
    line-height: 1.45;
  }

  .bar-block { margin-bottom: 22px; }
  .bar-top-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
    gap: 10px;
  }
  .bar-cat-label {
    font-family: var(--font-heading);
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text-primary);
  }
  .bar-status {
    font-size: 12.5px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .bar-track {
    height: 22px;
    background: var(--grid);
    border-radius: 5px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    transition: width 0.5s ease;
  }
  .bar-value {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-primary);
    margin-left: 8px;
  }

  .callout {
    border-radius: 12px;
    padding: 18px 20px;
    margin-top: 10px;
    margin-bottom: 18px;
    font-size: 14.5px;
    color: var(--text-primary);
  }
  .callout.blind { background: rgba(134,58,58,0.06); border: 1px solid rgba(134,58,58,0.22); }
  .callout.strength { background: rgba(226,217,188,0.35); border: 1px solid rgba(226,217,188,0.9); }
  .callout .callout-title {
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 13.5px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
    display: block;
  }
  .callout.blind .callout-title { color: var(--accent); }
  .callout.strength .callout-title { color: var(--obsidian); }

  .size-note {
    font-size: 13px;
    color: var(--text-muted);
    margin: -10px 0 26px;
  }

  .cta {
    margin-top: 30px;
    text-align: center;
    padding-top: 26px;
    border-top: 1px solid var(--border);
  }
  .cta h3 { font-family: var(--font-heading); margin: 0 0 8px; font-size: 19px; }
  .cta p { margin: 0 0 18px; color: var(--text-secondary); font-size: 14.5px; }

  .restart-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    text-decoration: underline;
  }

  .logo-intro {
    height: 34px;
    width: auto;
    display: block;
    margin: 0 0 26px;
  }
  .logo-footer {
    height: 22px;
    width: auto;
    display: block;
    margin: 26px auto 0;
    opacity: 0.85;
  }
</style>
</head>
<body>

<!--
  Hidden static form so Netlify's build-time bot can detect this form and
  set up capture for it — the real quiz is built dynamically in JS below,
  and Netlify can't see JS-rendered forms unless a matching static one like
  this exists somewhere in the page's raw HTML. This form is never shown or
  submitted directly by a person; the JS submits to it via fetch(). See
  https://docs.netlify.com/manage/forms/setup/
-->
<form name="scaling-pressure-check" data-netlify="true" netlify-honeypot="bot-field" style="display:none;">
  <input type="text" name="bot-field" />
  <input type="email" name="email" />
  <input type="text" name="team-size" />
  <input type="text" name="founder-evolution-score" />
  <input type="text" name="people-team-dynamics-score" />
  <input type="text" name="structure-organisation-score" />
  <input type="text" name="culture-values-score" />
  <input type="text" name="performance-progress-score" />
  <input type="text" name="reward-development-score" />
  <input type="text" name="focus-area-1" />
  <input type="text" name="focus-area-2" />
  <input type="text" name="focus-area-3" />
</form>

<div class="app" id="app"></div>

  // Guards against a fast double-click/double-tap registering as two answers:
  // each question screen has an option in the same on-screen position as the
  // next question's options, so an accidental second click can silently
  // answer a question the person never saw. Locked briefly after any answer.
  var answerLocked = false;
  function lockAnswerBriefly() {
    answerLocked = true;
    setTimeout(function () { answerLocked = false; }, 400);
  }

  function weightFor(answerKey, onsetIdx, sizeIdx) {
    if (answerKey === "worked") return 0.3;
    if (answerKey === "starting") return 1.5;
    if (answerKey === "wrestling") return 3;
    if (answerKey === "seen0") {
      return sizeIdx >= onsetIdx ? 2.2 : 0.6;
    }
    return 0;
  }

  function computeResults() {
    var catStats = {};
    CATEGORIES.forEach(function (c) { catStats[c.key] = { sum: 0, n: 0, blind: 0, worked: 0, topQuestion: null, topWeight: -1 }; });

    QUESTIONS.forEach(function (q) {
      var ans = state.answers[q.id];
      var w = weightFor(ans, q.onset, state.sizeIdx);
      var s = catStats[q.cat];
      s.sum += w;
      s.n += 1;
      if (ans === "seen0" && state.sizeIdx >= q.onset) s.blind += 1;
      if (ans === "worked") s.worked += 1;
      // Track the single sharpest-scoring question in this category — used
      // as a personalized supporting quote under "Your 3 focus areas".
      if (w > s.topWeight) { s.topWeight = w; s.topQuestion = q.text; }
    });

    var results = CATEGORIES.map(function (c) {
      var s = catStats[c.key];
      var avg = s.sum / s.n;
      var score = Math.round((avg / 3) * 100);
      var status;
      if (s.blind >= 2) status = "Possible blind spot";
      else if (score >= 60) status = "Live pressure";
      else if (score >= 32) status = "Starting to bite";
      else status = "Currently under control";
      return {
        key: c.key, label: c.label, emoji: c.emoji, color: c.color,
        score: score, status: status, blind: s.blind, worked: s.worked,
        topQuestion: s.topQuestion
      };
    });

    // Deliberately NOT sorted by score: bars stay in a fixed category order so
    // color-to-category mapping never depends on that person's answers (keeps
    // the validated adjacent-pair palette safe, and makes results comparable
    // across retakes). The top pressure areas are called out separately below.
    return results;
  }

  // Single source of truth for "what to focus on" so the results page and the
  // Netlify Forms submission never disagree with each other. Returns up to 3
  // categories, but only ones that actually cleared "starting to bite" or
  // worse — if someone's genuinely fine across the board, we don't manufacture
  // 3 fake concerns just to fill the box.
  function pickFocusAreas(results) {
    var ranked = results.slice().sort(function (a, b) { return b.score - a.score; });
    return ranked.filter(function (r) { return r.score >= 32; }).slice(0, 3);
  }

  // Fire-and-forget submit to Netlify Forms. Safe to call even when this page

  function submitToNetlifyForms(payload) {

    fetch("/", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },

    }).catch(function () { /* not deployed yet, or offline — ignore */ });
  }

  // Fire-and-forget call to the Netlify Function that emails the person their
  // results via Resend. Same "safe to call before it exists" philosophy as
  // submitToNetlifyForms above — if the function isn't deployed yet, or the
  // send fails server-side, the quiz flow is never blocked by it.
  function submitToSendResults(payload) {
    fetch("/.netlify/functions/send-results", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).catch(function () { /* not deployed yet, or offline — ignore */ });
  }

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined) return;
      if (k === "class") e.className = v;
      else if (k === "html") e.innerHTML = v;
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    });
    (children || []).forEach(function (c) {
      if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }

  function render() {
    var app = document.getElementById("app");
    app.innerHTML = "";
    var card = el("div", { class: "card" });

    if (state.screen === "intro") card.appendChild(renderIntro());
    else if (state.screen === "size") card.appendChild(renderSize());
    else if (state.screen === "question") card.appendChild(renderQuestion());
    else if (state.screen === "email") card.appendChild(renderEmail());
    else if (state.screen === "results") card.appendChild(renderResults());

    app.appendChild(card);
  }

  function renderIntro() {
    var wrap = el("div", {});
    wrap.appendChild(el("img", { class: "logo-intro", src: LOGO_SRC, alt: "Ma'at Partners" }));
    wrap.appendChild(el("p", { class: "eyebrow" }, ["Free scaling diagnostic"]));
    wrap.appendChild(el("h1", {}, ["The Scaling Pressure Check"]));
    wrap.appendChild(el("p", { class: "lead" }, [
      "18 quick questions on how founders, teams, structure, culture, performance and reward actually feel right now in your business. Two minutes. No wrong answers — including “we haven't hit this yet.”"
    ]));
    wrap.appendChild(el("div", { class: "btn-row center" }, [
      el("button", { class: "btn btn-primary", onclick: function () { state.screen = "size"; render(); } }, ["Start the check →"])
    ]));
    return wrap;
  }

  function renderSize() {
    var wrap = el("div", {});
    wrap.appendChild(el("p", { class: "eyebrow" }, ["Before we start"]));
    wrap.appendChild(el("div", { class: "q-text" }, ["How many people are in your business today?"]));
    var opts = el("div", { class: "options" });
    SIZE_BANDS.forEach(function (b) {
      var selected = state.sizeIdx === b.idx;
      var opt = el("button", {
        class: "option" + (selected ? " selected" : ""),
        onclick: function () { state.sizeIdx = b.idx; render(); }
      }, [el("span", { class: "dot" }), el("span", {}, [b.label])]);
      opts.appendChild(opt);
    });
    wrap.appendChild(opts);
    wrap.appendChild(el("div", { class: "btn-row" }, [
      el("button", { class: "btn btn-secondary", onclick: function () { state.screen = "intro"; render(); } }, ["← Back"]),
      el("button", {
        class: "btn btn-primary",
        disabled: state.sizeIdx === null ? "disabled" : null,
        onclick: function () { if (state.sizeIdx !== null) { state.screen = "question"; state.qIndex = 0; render(); } }
      }, ["Continue →"])
    ]));
    return wrap;
  }

  function renderQuestion() {
    var q = QUESTIONS[state.qIndex];
    var cat = CATEGORIES.filter(function (c) { return c.key === q.cat; })[0];
    var wrap = el("div", {});

    var pct = Math.round((state.qIndex / QUESTIONS.length) * 100);
    var progWrap = el("div", { class: "progress-wrap" });
    var track = el("div", { class: "progress-track" });
    track.appendChild(el("div", { class: "progress-fill", style: "width:" + pct + "%" }));
    progWrap.appendChild(track);
    progWrap.appendChild(el("div", { class: "progress-label" }, ["Question " + (state.qIndex + 1) + " of " + QUESTIONS.length]));
    wrap.appendChild(progWrap);

    wrap.appendChild(el("div", { class: "cat-tag" }, [cat.emoji + "  " + cat.label]));
    wrap.appendChild(el("div", { class: "q-text" }, [q.text]));

    var opts = el("div", { class: "options" });
    SCALE.forEach(function (s) {
      var selected = state.answers[q.id] === s.key;
      var opt = el("button", {
        class: "option" + (selected ? " selected" : ""),
        onclick: function () {
          if (answerLocked) return;
          lockAnswerBriefly();
          state.answers[q.id] = s.key;
          if (state.qIndex < QUESTIONS.length - 1) {
            state.qIndex += 1;
          } else {
            state.screen = "email";
          }
          render();
        }
      }, [el("span", { class: "dot" }), el("span", {}, [s.label])]);
      opts.appendChild(opt);
    });
    wrap.appendChild(opts);

    wrap.appendChild(el("div", { class: "btn-row" }, [
      el("button", {
        class: "btn btn-secondary",
        onclick: function () {
          if (state.qIndex === 0) { state.screen = "size"; }
          else { state.qIndex -= 1; }
          render();
        }
      }, ["← Back"])
    ]));

    return wrap;
  }

  function renderEmail() {
    var wrap = el("div", {});
    wrap.appendChild(el("p", { class: "eyebrow" }, ["Done — nice work"]));
    wrap.appendChild(el("h2", {}, ["Your Scaling Pressure results are ready"]));
    wrap.appendChild(el("p", { class: "lead" }, [
      "Where should we send them? You'll see your full breakdown on the next screen too."
    ]));
    var input = el("input", { type: "email", placeholder: "you@company.com", value: state.email });
    var emailValid = function () { return /^\S+@\S+\.\S+$/.test(state.email); };
    var showBtn = el("button", {
      class: "btn btn-primary",
      disabled: emailValid() ? null : "disabled",
      onclick: function () {
        if (!emailValid()) return;
        var results = computeResults();
        var focusAreas = pickFocusAreas(results);
        var scoreByKey = {};
        results.forEach(function (r) { scoreByKey[r.key] = r.score + "/100 — " + r.status; });
        var focusPayload = {};
        for (var i = 0; i < 3; i++) {
          var fa = focusAreas[i];
          focusPayload["focus-area-" + (i + 1)] = fa
            ? fa.label + " (" + fa.score + "/100) — \"" + fa.topQuestion + "\""
            : (i === 0 ? "None — nothing scored above a low level" : "");
        }
        submitToNetlifyForms(Object.assign({
          email: state.email,
          "team-size": SIZE_BANDS[state.sizeIdx].label,
          "founder-evolution-score": scoreByKey.founder,
          "people-team-dynamics-score": scoreByKey.people,
          "structure-organisation-score": scoreByKey.structure,
          "culture-values-score": scoreByKey.culture,
          "performance-progress-score": scoreByKey.performance,
          "reward-development-score": scoreByKey.reward
        }, focusPayload));
        submitToSendResults({
          email: state.email,
          sizeLabel: SIZE_BANDS[state.sizeIdx].label,
          results: results.map(function (r) {
            return { emoji: r.emoji, label: r.label, score: r.score, status: r.status };
          }),
          focusAreas: focusAreas.map(function (f) {
            return { label: f.label, score: f.score, topQuestion: f.topQuestion };
          })
        });
        state.screen = "results";
        render();
      }
    }, ["Show my results →"]);
    input.addEventListener("input", function (e) {
      state.email = e.target.value;
      showBtn.disabled = !emailValid();
    });
    wrap.appendChild(input);
    wrap.appendChild(el("p", { class: "fine-print" }, ["We'll only use this to send your results and the occasional useful thing. Unsubscribe any time."]));
    wrap.appendChild(el("div", { class: "btn-row" }, [
      el("button", { class: "btn btn-secondary", onclick: function () { state.screen = "question"; state.qIndex = QUESTIONS.length - 1; render(); } }, ["← Back"]),
      showBtn
    ]));
    return wrap;
  }

  function renderResults() {
    var results = computeResults();
    var focusAreas = pickFocusAreas(results);
    var sizeLabel = SIZE_BANDS[state.sizeIdx].label;
    var blindCats = results.filter(function (r) { return r.blind >= 2; });
    var strengthCats = results.filter(function (r) { return r.worked >= 2; }).sort(function(a,b){return a.score - b.score;});

    var wrap = el("div", {});
    wrap.appendChild(el("p", { class: "eyebrow" }, ["Your results"]));
    wrap.appendChild(el("h2", {}, ["Here's where the pressure is right now"]));
    wrap.appendChild(el("p", { class: "size-note" }, ["Based on your answers, sized for a " + sizeLabel + " business."]));

    // 1. The full breakdown, every category, in fixed order.
    results.forEach(function (r) {
      var block = el("div", { class: "bar-block" });
      var topRow = el("div", { class: "bar-top-row" });
      topRow.appendChild(el("span", { class: "bar-cat-label" }, [r.emoji + " " + r.label]));
      topRow.appendChild(el("span", { class: "bar-status" }, [r.status]));
      block.appendChild(topRow);

      var track = el("div", { class: "bar-track" });
      var fill = el("div", {
        class: "bar-fill",
        style: "width:" + Math.max(r.score, 4) + "%; background:" + r.color + ";"
      });
      track.appendChild(fill);
      block.appendChild(track);
      wrap.appendChild(block);
    });

    // 2. Affirm what's working.
    if (strengthCats.length) {
      var strengthNames = strengthCats.map(function (c) { return c.emoji + " " + c.label; }).join(", ");
      var s = el("div", { class: "callout strength" });
      s.appendChild(el("span", { class: "callout-title" }, ["Where you're doing well"]));
      s.appendChild(el("p", {}, [
        "You've genuinely worked through several things in " + strengthNames + ". That's real progress — worth protecting as you keep growing."
      ]));
      wrap.appendChild(s);
    }

    // 3. Flag any possible blind spots.
    if (blindCats.length) {
      var blindNames = blindCats.map(function (c) { return c.emoji + " " + c.label; }).join(", ");
      var b = el("div", { class: "callout blind" });
      b.appendChild(el("span", { class: "callout-title" }, ["Possible blind spot"]));
      b.appendChild(el("p", {}, [
        "At " + sizeLabel + ", most businesses have already run into " + blindNames + ". You said you haven't — worth a second look, since it may mean it hasn't surfaced yet rather than that it isn't there."
      ]));
      wrap.appendChild(b);
    }

    // 4. Land on the prioritized takeaway right before the CTA.
    if (focusAreas.length === 0) {
      var allClear = el("div", { class: "headline-box" });
      allClear.appendChild(el("p", { class: "eyebrow" }, ["Nothing flashing red"]));
      allClear.appendChild(el("p", {}, [
        "Nothing scored as live pressure right now — you're in a solid spot. Worth revisiting as you keep growing."
      ]));
      wrap.appendChild(allClear);
    } else {
      wrap.appendChild(el("p", { class: "focus-lead" }, ["Your " + focusAreas.length + " focus area" + (focusAreas.length > 1 ? "s" : "") + " right now"]));
      var focusList = el("div", { class: "focus-list" });
      focusAreas.forEach(function (fa, i) {
        var card = el("div", { class: "focus-card" });
        card.appendChild(el("div", { class: "focus-rank" }, [String(i + 1)]));
        var body = el("div", { class: "focus-body" });
        var titleRow = el("div", { class: "focus-title-row" });
        titleRow.appendChild(el("span", { class: "focus-title" }, [fa.emoji + " " + fa.label]));
        titleRow.appendChild(el("span", { class: "focus-score" }, [fa.score + "/100"]));
        body.appendChild(titleRow);
        body.appendChild(el("blockquote", { class: "focus-quote" }, ["“" + fa.topQuestion + "”"]));
        card.appendChild(body);
        focusList.appendChild(card);
      });
      wrap.appendChild(focusList);
    }

    var cta = el("div", { class: "cta" });
    cta.appendChild(el("h3", {}, ["Want to talk through where to start?"]));
    cta.appendChild(el("p", {}, ["A short conversation is usually enough to tell you whether it's a quick fix or something bigger."]));
    cta.appendChild(el("a", { class: "btn btn-primary", href: "https://www.maatpartners.co.uk/contact", target: "_blank", rel: "noopener", style: "text-decoration:none; display:inline-block;" }, ["Get in touch →"]));
    wrap.appendChild(cta);

    wrap.appendChild(el("span", {
      class: "restart-link",
      onclick: function () {
        state = { screen: "intro", sizeIdx: null, qIndex: 0, answers: {}, email: "" };
        render();
      }
    }, ["Restart the check"]));

    wrap.appendChild(el("img", { class: "logo-footer", src: LOGO_SRC, alt: "Ma'at Partners" }));

    return wrap;
  }

  render();
})();
</script>
</body>
</html>
